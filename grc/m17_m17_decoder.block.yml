id: m17_m17_decoder
label: M17 Decoder
category: '[M17]/Baseband'

parameters:
# --- General ---
- id: sw_threshold
  label: Syncword threshold
  category: General
  dtype: float
  default: 2.0
- id: vt_threshold
  label: Viterbi threshold
  category: General
  dtype: float
  default: 30.0
- id: callsign
  label: Display callsign
  category: General
  dtype: bool
  default: False
  options: ['True', 'False']
- id: undecodable_out
  label: Undecryptable/signature frames
  category: General
  dtype: int
  default: 0
  options: ['0', '1', '2']
  option_labels: ['Output Codec2 silence', 'Output zeros', 'Output nothing']
# --- Encryption (the encryption type and key size are taken from the received stream) ---
- id: key
  label: AES key (hex, optional)
  category: Encryption
  dtype: string
  default: ''
- id: seed
  label: Scrambler seed (hex, optional)
  category: Encryption
  dtype: string
  default: ''
# --- Signing ---
- id: pub_key
  label: Public key (hex, 64 bytes, optional)
  category: Signing
  dtype: string
  default: ''
# --- Debug ---
- id: debug_data
  label: Debug data
  category: Debug
  dtype: bool
  default: False
  options: ['True', 'False']
- id: debug_ctrl
  label: Debug control
  category: Debug
  dtype: bool
  default: False
  options: ['True', 'False']

asserts:
    - ${ all(c in '0123456789abcdefABCDEF' for c in key.replace(' ', '')) and len(key.replace(' ', '')) in (0, 32, 48, 64) }
    - ${ all(c in '0123456789abcdefABCDEF' for c in seed.replace(' ', '')) and len(seed.replace(' ', '')) in (0, 2, 4, 6) and (len(seed.replace(' ', '')) == 0 or int(seed.replace(' ', ''), 16) != 0) }
    - ${ all(c in '0123456789abcdefABCDEF' for c in pub_key.replace(' ', '')) and len(pub_key.replace(' ', '')) in (0, 128) }

templates:
  imports: from gnuradio import m17
  # Signed/unsigned and the encryption type/size are read from each received LSF, so they are not parameters
  # (signed_str=False and encr_type=0 are just initial values).
  make: m17.m17_decoder(${debug_data},${debug_ctrl},${sw_threshold},${vt_threshold},${callsign},False,0,bytes.fromhex(${key}).decode('latin-1'),bytes.fromhex(${seed}).decode('latin-1'),bytes.fromhex(${pub_key}).decode('latin-1'),${undecodable_out})

  callbacks:
    - set_debug_data(${debug_data})
    - set_debug_ctrl(${debug_ctrl})
    - set_key(bytes.fromhex(${key}).decode('latin-1'))
    - set_pub_key(bytes.fromhex(${pub_key}).decode('latin-1'))
    - set_callsign(${callsign})
    - set_seed(bytes.fromhex(${seed}).decode('latin-1'))
    - set_sw_threshold(${sw_threshold})
    - set_vt_threshold(${vt_threshold})
    - set_undecodable_out(${undecodable_out})

inputs:
- label: in
  domain: stream
  dtype: float
  vlen: 1
  optional: False

outputs:
- label: out
  domain: stream
  dtype: byte
  vlen: 1
  optional: False
- id: fields
  domain: message
  optional: True

documentation: |-
     The decoder reads a stream of symbols (as floats) at 4800 Hz and outputs the decoded payload (as bytes). Decoded LSF fields are published on the 'fields' message port when a transmission starts and whenever the LSF changes.
     Syncword threshold: maximum Euclidean (L2) distance between the received symbols and a syncword for a frame to be detected (0 = perfect match).
     Viterbi threshold: maximum accumulated Viterbi error for a decoded frame to be accepted; rejected frames are replaced with Codec2 (3200) encoded silence.
     Undecryptable/signature frames: what to output for frames that cannot be decrypted (AES key or scrambler seed missing or of the wrong size) and for the signature frames of signed streams - Codec2 encoded silence or zeros (both keep the timing), or nothing.
     Encryption: whether a stream is encrypted, and how (scrambler size, AES key length), is read from its LSF. Enter the AES key (32/48/64 hex digits) and/or the scrambler seed (2/4/6 hex digits) needed to decrypt the streams you expect; the decoder warns when a received stream needs a key that is missing or has the wrong length.
     Public key: 64-byte secp256r1 public key used to verify signed streams. Whether a stream is signed is read from its LSF.

file_format: 1
