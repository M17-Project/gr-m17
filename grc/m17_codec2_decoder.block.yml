id: m17_codec2_decoder
label: Codec2 Decoder
category: '[M17]/Voice Codec'

templates:
  imports: from gnuradio import m17
  make: m17.codec2_decoder()

inputs:
- label: in
  domain: stream
  dtype: byte
  vlen: 1
  optional: False
- label: state_reset
  domain: message
  optional: True

outputs:
- label: out
  domain: stream
  dtype: short
  vlen: 1
  optional: False

documentation: |-
     The decoder block reads encoded audio (as bytes, 8 per frame) at 3200 bps and outputs an audio stream (as shorts, in packs of 160).

file_format: 1

