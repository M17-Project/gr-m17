id: m17_symbol_sync
label: Symbol Sync
category: '[M17]'

parameters:
- id: in_sps
  label: Input samples per symbol
  dtype: int
  default: 10
- id: loop_bw
  label: Loop bandwidth
  dtype: float
  default: 0.001
- id: max_dev
  label: Maximum deviation
  dtype: float
  default: 0.05

templates:
  imports: from gnuradio import m17
  make: m17.symbol_sync(${in_sps},${loop_bw},${max_dev})
  callbacks:
    - set_in_sps(${in_sps})
    - set_loop_bw(${loop_bw})
    - set_max_dev(${max_dev})

#  Make one 'inputs' list entry per input and one 'outputs' list entry per output.
#  Keys include:
#      * label (an identifier for the GUI)
#      * domain (optional - stream or message. Default is stream)
#      * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#      * vlen (optional - data stream vector length. Default is 1)
#      * optional (optional - set to 1 for optional inputs. Default is 0)
inputs:
- label: in
  domain: stream
  dtype: float
  vlen: 1
  optional: 0

outputs:
- label: out
  domain: stream
  dtype: float
  vlen: 1
  optional: 0

asserts:
  - ${ in_sps > 1 }
  - ${ loop_bw > 0.0 }
  - ${ max_dev > 0.0 }

documentation: |-
     This Symbol Sync block uses Gardner algorithm. The block reads floats and outputs floats. The block outputs 1 sample per symbol.

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1

