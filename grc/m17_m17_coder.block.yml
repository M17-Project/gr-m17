id: m17_m17_coder
label: M17 Encoder
category: '[M17]/Baseband'

parameters:
# --- General ---
- id: src_id
  label: Source callsign
  category: General
  dtype: string
  default: 'N0CALL'
- id: dst_id
  label: Destination callsign
  category: General
  dtype: string
  default: '@ALL'
- id: type
  label: Payload type
  category: General
  dtype: int
  default: 2
  options: ['0', '1', '2', '3']
  option_labels: ['Reserved', 'Data', 'Voice', 'Voice+Data']
- id: can
  label: CAN
  category: General
  dtype: int
  default: 0
- id: eot_cnt
  label: EoT count
  category: General
  dtype: int
  default: 1
- id: continuous
  label: Transmission control
  category: General
  dtype: bool
  default: 'False'
  options: ['False', 'True']
  option_labels: ['Messages (SOT/EOT/SMS)', 'Continuous']
# --- Encryption ---
- id: encr_type
  label: Encryption
  category: Encryption
  dtype: int
  default: 0
  options: ['0', '1', '2', '3']
  option_labels: ['None', 'Scrambler', 'AES', 'Other/Reserved']
- id: seed
  label: Scrambler seed (hex, 2/4/6 digits = 8/16/24-bit)
  category: Encryption
  dtype: string
  default: ''
  hide: ${ 'none' if encr_type == 1 else 'all' }
- id: aes_subtype
  label: AES key size
  category: Encryption
  dtype: int
  default: 0
  options: ['0', '1', '2']
  option_labels: ['AES128', 'AES192', 'AES256']
  hide: ${ 'none' if encr_type == 2 else 'all' }
- id: key
  label: AES key (hex)
  category: Encryption
  dtype: string
  default: ''
  hide: ${ 'none' if encr_type == 2 else 'all' }
# --- Meta (no encryption only; Meta type selects the contents) ---
- id: encr_subtype
  label: Meta type
  category: Meta
  dtype: int
  default: 0
  options: ['0', '1', '2', '3']
  option_labels: ['Text', 'Geolocation', 'Extended callsign data', 'Reserved']
  hide: ${ 'none' if encr_type == 0 else 'all' }
- id: meta
  label: Text (max 52 bytes)
  category: Meta
  dtype: string
  default: ''
  hide: ${ 'none' if (encr_type == 0 and encr_subtype == 0) else 'all' }
- id: meta_lat
  label: Latitude (deg)
  category: Meta
  dtype: float
  default: 0.0
  hide: ${ 'none' if (encr_type == 0 and encr_subtype == 1) else 'all' }
- id: meta_lon
  label: Longitude (deg)
  category: Meta
  dtype: float
  default: 0.0
  hide: ${ 'none' if (encr_type == 0 and encr_subtype == 1) else 'all' }
- id: meta_alt
  label: Altitude (m)
  category: Meta
  dtype: float
  default: 0.0
  hide: ${ 'none' if (encr_type == 0 and encr_subtype == 1) else 'all' }
- id: meta_speed
  label: Speed (km/h)
  category: Meta
  dtype: float
  default: 0.0
  hide: ${ 'none' if (encr_type == 0 and encr_subtype == 1) else 'all' }
- id: meta_bearing
  label: Bearing (deg)
  category: Meta
  dtype: int
  default: 0
  hide: ${ 'none' if (encr_type == 0 and encr_subtype == 1) else 'all' }
- id: meta_station
  label: Station type
  category: Meta
  dtype: int
  default: 0
  options: ['0', '1', '2', '15']
  option_labels: ['Fixed', 'Mobile', 'Handheld', 'Other']
  hide: ${ 'none' if (encr_type == 0 and encr_subtype == 1) else 'all' }
- id: meta_source
  label: Data source
  category: Meta
  dtype: int
  default: 0
  options: ['0', '1', '15']
  option_labels: ['M17 client', 'OpenRTX', 'Other']
  hide: ${ 'none' if (encr_type == 0 and encr_subtype == 1) else 'all' }
- id: meta_cf1
  label: Callsign field 1
  category: Meta
  dtype: string
  default: ''
  hide: ${ 'none' if (encr_type == 0 and encr_subtype == 2) else 'all' }
- id: meta_cf2
  label: Callsign field 2
  category: Meta
  dtype: string
  default: ''
  hide: ${ 'none' if (encr_type == 0 and encr_subtype == 2) else 'all' }
- id: meta_hex
  label: Raw META (hex, max 14 bytes)
  category: Meta
  dtype: string
  default: ''
  hide: ${ 'none' if (encr_type == 0 and encr_subtype == 3) else 'all' }
# --- Signing ---
- id: signed_str
  label: Signed stream
  category: Signing
  dtype: bool
  default: False
  options: ['True', 'False']
- id: priv_key
  label: Private key (hex, 32 bytes)
  category: Signing
  dtype: string
  default: ''
  hide: ${ 'none' if signed_str else 'all' }
# --- Debug ---
- id: debug
  label: Debug
  category: Debug
  dtype: bool
  default: False
  options: ['True', 'False']

asserts:
    - ${ can <= 15 }
    - ${ len(dst_id) < 10 }
    - ${ len(src_id) < 10 }
    # hex fields are only checked when they are in use (hidden values are ignored)
    - ${ encr_type != 1 or (all(c in '0123456789abcdefABCDEF' for c in seed.replace(' ', '')) and len(seed.replace(' ', '')) in (2, 4, 6) and int(seed.replace(' ', ''), 16) != 0) }
    - ${ encr_type != 2 or (all(c in '0123456789abcdefABCDEF' for c in key.replace(' ', '')) and len(key.replace(' ', '')) == 32 + 16 * aes_subtype) }
    - ${ not signed_str or (all(c in '0123456789abcdefABCDEF' for c in priv_key.replace(' ', '')) and len(priv_key.replace(' ', '')) == 64) }
    # Meta fields are only checked when they are in use
    - ${ encr_type != 0 or encr_subtype != 0 or len(meta.encode('utf-8')) <= 52 }
    - ${ encr_type != 0 or encr_subtype != 1 or (-90 <= meta_lat <= 90 and -180 <= meta_lon <= 180) }
    - ${ encr_type != 0 or encr_subtype != 1 or (-500 <= meta_alt <= 32267.5 and 0 <= meta_speed <= 2047.5 and 0 <= meta_bearing <= 359) }
    - ${ encr_type != 0 or encr_subtype != 2 or (0 < len(meta_cf1) <= 9 and len(meta_cf2) <= 9) }
    - ${ encr_type != 0 or encr_subtype != 3 or (all(c in '0123456789abcdefABCDEF' for c in meta_hex.replace(' ', '')) and len(meta_hex.replace(' ', '')) % 2 == 0 and len(meta_hex.replace(' ', '')) <= 28) }

templates:
  imports: from gnuradio import m17
  # TYPE subtype bits: Meta type (no encryption), seed length (scrambler) or AES key size (AES);
  # META is assembled by m17.build_meta() from the Meta tab fields;
  # key/seed/priv_key are entered as hex text and converted to byte strings here;
  # fields that are not in use are passed as '' so hidden values have no effect
  make: m17.m17_coder(${src_id},${dst_id},${type},${encr_type},(${encr_subtype} if ${encr_type} == 0 else len(${seed}.replace(' ', '')) // 2 - 1 if ${encr_type} == 1 else ${aes_subtype} if ${encr_type} == 2 else 0),${aes_subtype},${can},m17.build_meta(${encr_type}, ${encr_subtype}, ${meta}, ${meta_lat}, ${meta_lon}, ${meta_alt}, ${meta_speed}, ${meta_bearing}, ${meta_station}, ${meta_source}, ${meta_cf1}, ${meta_cf2}, ${meta_hex}),bytes.fromhex(${key} if ${encr_type} == 2 else '').decode('latin-1'),bytes.fromhex(${priv_key} if ${signed_str} else '').decode('latin-1'),${debug},${signed_str},bytes.fromhex(${seed} if ${encr_type} == 1 else '').decode('latin-1'),${eot_cnt},${continuous})
  callbacks:
    - set_src_id(${src_id})
    - set_dst_id(${dst_id})
    - set_data(${type})
    - set_encr_type(${encr_type})
    - set_encr_subtype((${encr_subtype} if ${encr_type} == 0 else len(${seed}.replace(' ', '')) // 2 - 1 if ${encr_type} == 1 else ${aes_subtype} if ${encr_type} == 2 else 0))
    - set_meta(m17.build_meta(${encr_type}, ${encr_subtype}, ${meta}, ${meta_lat}, ${meta_lon}, ${meta_alt}, ${meta_speed}, ${meta_bearing}, ${meta_station}, ${meta_source}, ${meta_cf1}, ${meta_cf2}, ${meta_hex}))
    - set_aes_subtype(${aes_subtype}, ${encr_type})
    - set_can(${can})
    - set_key(bytes.fromhex(${key} if ${encr_type} == 2 else '').decode('latin-1'))
    - set_priv_key(bytes.fromhex(${priv_key} if ${signed_str} else '').decode('latin-1'))
    - set_debug(${debug})
    - set_signed(${signed_str})
    - set_seed(bytes.fromhex(${seed} if ${encr_type} == 1 else '').decode('latin-1'))
    - set_eot_cnt(${eot_cnt})

inputs:
- label: in
  domain: stream
  dtype: byte
  vlen: 1
  optional: False
- label: transmission_control
  domain: message
  optional: ${ continuous }

outputs:
- label: out
  domain: stream
  dtype: float
  vlen: 1
  optional: False

documentation: |-
     The encoder reads payload bytes (16 per frame, e.g. two 8-byte Codec2 3200 frames for voice) and outputs a stream of symbols (as floats) at 4800 Hz.
     Transmission control: in Messages mode, SOT and EOT messages on the transmission_control port start and end a stream, and SMS messages send a text message (up to 821 bytes) as a packet transmission; in Continuous mode, the stream starts with the flowgraph and ends when the input ends.
     Source and destination are callsigns of up to 9 characters. META (Meta tab) carries text (up to 52 bytes, sent as up to 4 blocks, one per superframe), a GNSS position, extended callsign data or raw bytes; with AES it carries the nonce, generated for every transmission.
     Keys and seeds are entered as hex: AES key 32/48/64 digits, scrambler seed 2/4/6 digits (8/16/24-bit LFSR), ECDSA private key 64 digits.

file_format: 1