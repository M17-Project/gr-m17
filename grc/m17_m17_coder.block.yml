id: m17_m17_coder
label: M17 Encoder
category: '[M17]/Baseband'

parameters:
# --- General ---
- id: src_id
  label: Source callsign
  category: General
  dtype: string
  default: 'N0CALL'
- id: dst_id
  label: Destination callsign
  category: General
  dtype: string
  default: '@ALL'
- id: type
  label: Payload type
  category: General
  dtype: int
  default: 2
  options: ['0', '1', '2', '3']
  option_labels: ['Reserved', 'Data', 'Voice', 'Voice+Data']
- id: can
  label: CAN
  category: General
  dtype: int
  default: 0
- id: meta
  label: Meta
  category: General
  dtype: string
  default: ''
  hide: ${ 'all' if encr_type == 2 else 'none' }
- id: eot_cnt
  label: EoT count
  category: General
  dtype: int
  default: 1
# --- Encryption ---
- id: encr_type
  label: Encryption
  category: Encryption
  dtype: int
  default: 0
  options: ['0', '1', '2', '3']
  option_labels: ['None', 'Scrambler', 'AES', 'Other/Reserved']
- id: encr_subtype
  label: Subtype
  category: Encryption
  dtype: int
  default: 0
  options: ['0', '1', '2', '3']
  option_labels: ['Text', 'Geolocation', 'Extended callsign data', 'Reserved']
- id: seed
  label: Scrambler seed
  category: Encryption
  dtype: string
  default: ''
  hide: ${ 'none' if encr_type == 1 else 'all' }
- id: aes_subtype
  label: AES key size
  category: Encryption
  dtype: int
  default: 0
  options: ['0', '1', '2']
  option_labels: ['AES128', 'AES192', 'AES256']
  hide: ${ 'none' if encr_type == 2 else 'all' }
- id: key
  label: AES key
  category: Encryption
  dtype: string
  default: ''
  hide: ${ 'none' if encr_type == 2 else 'all' }
# --- Signing ---
- id: signed_str
  label: Signed stream
  category: Signing
  dtype: bool
  default: False
  options: ['True', 'False']
- id: priv_key
  label: Private key (ECDSA, 32 bytes)
  category: Signing
  dtype: string
  default: ''
  hide: ${ 'none' if signed_str else 'all' }
# --- Debug ---
- id: debug
  label: Debug
  category: Debug
  dtype: bool
  default: False
  options: ['True', 'False']

asserts:
    - ${ can <= 15 }
    - ${ len(key) <= 32 }
    - ${ len(priv_key) <= 32 }
    - ${ len(dst_id) < 10 }
    - ${ len(src_id) < 10 }

templates:
  imports: from gnuradio import m17
  # a hidden scrambler seed must not switch scrambling on, so pass '' unless Scrambler is selected
  make: m17.m17_coder(${src_id},${dst_id},${type},${encr_type},${encr_subtype},${aes_subtype},${can},${meta},${key},${priv_key},${debug},${signed_str},${seed if encr_type() == 1 else "''"},${eot_cnt})
  callbacks:
    - set_meta(${meta})
    - set_src_id(${src_id})
    - set_dst_id(${dst_id})
    - set_type(${type})
    - set_encr_type(${encr_type})
    - set_encr_subtype(${encr_subtype})
    - set_aes_subtype(${aes_subtype})
    - set_can(${can})
    - set_key(${key})
    - set_priv_key(${priv_key})
    - set_debug(${debug})
    - set_signed(${signed_str})
    - set_seed(${seed if encr_type() == 1 else "''"})
    - set_eot_cnt(${eot_cnt})

#  Make one 'inputs' list entry per input and one 'outputs' list entry per output.
#  Keys include:
#      * label (an identifier for the GUI)
#      * domain (optional - stream or message. Default is stream)
#      * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#      * vlen (optional - data stream vector length. Default is 1)
#      * optional (optional - set to 1 for optional inputs. Default is 0)
inputs:
- label: in
  domain: stream
  dtype: byte
  vlen: 1
  optional: 0
- label: transmission_control
  domain: message
  optional: 0

outputs:
- label: out
  domain: stream
  dtype: float
  vlen: 1
  optional: 0

documentation: |-
     The encoder block reads a datastream (as 16-byte vectors) clocked at 3200 bits/s and outputs a stream of symbols (as floats) at 4800 Hz. The source and destination fields are 9-character callsign strings, the TYPE field is generated based on drop-down menu entries and the META field is a string or a byte array that can be updated at runtime.

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1